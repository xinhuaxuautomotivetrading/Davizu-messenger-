name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Copy web files into www
        run: npm run build
      - name: Add Android
        run: npx cap add android
      - name: Allow microphone for voice notes
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Sync web to Android
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Davizu-Messenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
